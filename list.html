<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List — ROSE Demonlist</title>
<meta name="description" content="Every rated level a ROSE member has beaten, sorted hardest to easiest.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ROSE Demonlist">
<meta property="og:title" content="The List — ROSE Demonlist">
<meta property="og:description" content="Every rated level a ROSE member has beaten, sorted hardest to easiest.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ff3b52">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="site-nav" id="site-nav"></nav>

<header class="container">
  <div class="page-head">
    <div class="eyebrow">Ranked by AREDL placement</div>
    <h1>The List</h1>
    <p>Every rated level a clan member has beaten, sorted hardest to easiest. Points and placement come straight from AREDL.</p>
  </div>
</header>

<main>
  <div class="container">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
      <input id="search" type="text" placeholder="Search level or player…"
        style="flex:1;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;">
      <select id="sort" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;">
        <option value="internal">Sort: Internal Ranking</option>
        <option value="aredl">Sort: AREDL Ranking</option>
        <option value="name">Sort: Level Name</option>
      </select>
    </div>

    <div id="list-mount">
      <div class="skel" style="height:104px;margin-bottom:12px;"></div>
      <div class="skel" style="height:104px;margin-bottom:12px;opacity:.7;"></div>
      <div class="skel" style="height:104px;margin-bottom:12px;opacity:.4;"></div>
    </div>
  </div>
</main>

<footer class="container"><span id="clan-name-footer"></span> Demonlist — built on the AREDL API. Not affiliated with or endorsed by AREDL.</footer>

<script src="common.js"></script>
<script>
  renderNav("list.html");
  document.getElementById("clan-name-footer").textContent = CONFIG.clanName;

  let allLevels = [];

  // Internal rank is ROSE's own sequential numbering (#1 = hardest level the
  // clan has beaten, #2 = next hardest, ...), distinct from a level's real
  // AREDL placement, which can have gaps (the clan's hardest beat might be
  // global AREDL #19, not #1). Computed once from the full hardest-to-easiest
  // order so it stays stable regardless of search or the current sort.
  function assignInternalRanks(levels) {
    [...levels].sort((a, b) => a.rank - b.rank).forEach((lvl, i) => { lvl.internalRank = i + 1; });
  }

  function draw() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const sort = document.getElementById("sort").value;

    // Matches a player on either side: the level's listed verifier, or
    // anyone in followingVictors (every other clan member who's also
    // beaten it) — so searching a name surfaces every completion of theirs.
    let rows = allLevels.filter(l =>
      !q || l.name.toLowerCase().includes(q) || l.verifier.toLowerCase().includes(q)
      || (l.followingVictors || []).some(v => v.toLowerCase().includes(q))
    );

    // Internal and AREDL modes share the same underlying order (hardest to
    // easiest by AREDL placement) — they only differ in which number ends up
    // on the badge. Name mode sorts alphabetically but still shows the
    // stable internal rank, so the number stays meaningful either way.
    if (sort === "name") rows.sort((a, b) => a.name.localeCompare(b.name));
    else rows.sort((a, b) => a.rank - b.rank);

    const mount = document.getElementById("list-mount");
    if (!rows.length) {
      mount.innerHTML = `<div class="empty-state"><div class="title">No levels match</div>Try a different search term.</div>`;
      return;
    }
    const display = rows.map(lvl => ({ ...lvl, rank: sort === "aredl" ? lvl.rank : lvl.internalRank }));
    mount.innerHTML = display.map((lvl, i) => levelCardHTML(lvl, i)).join("");
    hydrateThumbnails(mount, display);
  }

  (async () => {
    allLevels = await apiGet("/list", MOCK_LIST);
    assignInternalRanks(allLevels);
    draw();
    document.getElementById("search").addEventListener("input", draw);
    document.getElementById("sort").addEventListener("change", draw);
  })();
</script>
</body>
</html>
