name = "roseweb"
main = "worker.js"
compatibility_date = "2026-09-23"

[vars]
AREDL_API_BASE = "https://api.aredl.net"
AREDL_CLAN_ID = "your-clan-id"
UNRATED_SHEET_ID = "your-google-sheet-id"
VIDEO_FEED_URL = "" # e.g. a YouTube channel's public RSS feed URL

[[d1_databases]]
binding = "DB"
database_name = "rift-demonlist"
database_id = "YOUR_DATABASE_ID"

[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

# Serve the static pages from the same Worker, or deploy them separately
# to Cloudflare Pages and point CONFIG.apiBase (in common.js) at this
# Worker's URL instead. If serving together, exclude the non-frontend
# files so they aren't published as static assets:
# [assets]
# directory = "."
# exclude = ["worker.js", "wrangler.toml", "0001_initial.sql", "README.md"]
