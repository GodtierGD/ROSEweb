<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly — ROSE Demonlist</title>
<link rel="icon" href="Resources/ROSECLANLOGO.png" type="image/png">
<meta name="description" content="ROSE's completions, archived month by month.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ROSE Demonlist">
<meta property="og:title" content="Monthly — ROSE Demonlist">
<meta property="og:description" content="ROSE's completions, archived month by month.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ff3b52">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="site-nav" id="site-nav"></nav>

<header class="container">
  <div class="page-head">
    <div class="eyebrow">Archive</div>
    <h1>Monthly</h1>
    <p>The hardest levels the clan beat each month. Snapshotted at the time of the beat, so this page won't change if a level's AREDL placement moves later.</p>
  </div>
</header>

<main>
  <div class="container">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
      <select id="month-select" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;"></select>
      <select id="sort" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;">
        <option value="internal">Sort: CLAN Ranking</option>
        <option value="aredl">Sort: AREDL Ranking</option>
        <option value="name">Sort: Level Name</option>
      </select>
    </div>
    <div id="month-mount">
      <div class="skel" style="height:104px;margin-bottom:12px;"></div>
      <div class="skel" style="height:104px;margin-bottom:12px;opacity:.6;"></div>
    </div>
  </div>
</main>

<footer class="container"><span id="clan-name-footer"></span> Demonlist — built on the AREDL API. Not affiliated with or endorsed by AREDL.</footer>

<script src="common.js"></script>
<script>
  renderNav("monthly.html");
  document.getElementById("clan-name-footer").textContent = CONFIG.clanName;

  function thisMonthLabel() {
    return new Date().toLocaleString("en-US", { month: "long", year: "numeric" });
  }

  function renderPicker(months, active) {
    const sel = document.getElementById("month-select");
    // Newest first. If the current calendar month has no completions yet,
    // it still gets its own option (at the top) so it can be the default.
    const keys = Object.keys(months);
    if (!keys.includes(active)) keys.unshift(active);
    sel.innerHTML = keys.map(k => `<option value="${esc(k)}" ${k === active ? "selected" : ""}>${esc(k)}</option>`).join("");
    sel.onchange = () => renderMonth(months, sel.value);
  }

  function renderMonth(months, active) {
    renderPicker(months, active);
    const sort = document.getElementById("sort").value;

    let rows = [...(months[active] || [])];
    if (sort === "name") rows.sort((a, b) => a.name.localeCompare(b.name));
    else rows.sort((a, b) => a.rank - b.rank);

    const mount = document.getElementById("month-mount");
    if (!rows.length) {
      mount.innerHTML = `<div class="empty-state"><div class="title">Nothing logged yet</div>No completions recorded for ${esc(active)}.</div>`;
      return;
    }
    const display = rows.map(lvl => applyRankDisplay(lvl, sort));
    mount.innerHTML = display.map((lvl, i) => levelCardHTML(lvl, i)).join("");
    hydrateThumbnails(mount, display);
  }

  (async () => {
    const months = await apiGet("/monthly", MOCK_MONTHLY);
    // Internal rank has to be computed across every month's levels at once
    // (not per-month), so the same level always shows the same internal
    // rank here as it does on the List page.
    assignInternalRanks(Object.values(months).flat());

    const active = thisMonthLabel();
    renderMonth(months, active);
    document.getElementById("sort").addEventListener("change", () => renderMonth(months, document.getElementById("month-select").value));
  })();
</script>
</body>
</html>
